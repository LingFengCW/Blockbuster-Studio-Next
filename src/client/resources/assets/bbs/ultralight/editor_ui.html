<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>BBS 重构动画编辑器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",Consolas,monospace;user-select:none;}
body{background:#14181e;color:#e6e6e6;height:100vh;overflow:hidden;font-size:13px;}
/* 顶部标题栏 */
.title-bar{height:30px;background:#2c2c30;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #111;font-size:13px;gap:10px;}
.title-dirty{color:#ff5555;margin:0 2px;display:none;}
.title-dirty.show{display:inline;}
.title-btn{margin-left:auto;padding:3px 10px;background:#38383c;border-radius:3px;cursor:pointer;font-size:12px;}
.title-btn:hover{background:#094872;}
/* 顶部主菜单栏 */
.main-menu{height:28px;background:#242426;display:flex;border-bottom:1px solid #111;}
.menu-top-item{padding:4px 16px;font-size:13px;cursor:pointer;position:relative;}
.menu-top-item:hover{background:#094872;}
.menu-dropdown{position:absolute;top:100%;left:0;background:#2c2c30;border:1px solid #555;min-width:180px;display:none;z-index:50;}
.menu-top-item:hover .menu-dropdown{display:block;}
.menu-item{padding:5px 12px;font-size:12px;cursor:pointer;}
.menu-item:hover{background:#094872;}
.menu-divider{height:1px;background:#444;margin:3px 0;}
/* 整体布局容器 */
.container{display:grid;grid-template-columns:50px 260px 1fr;grid-template-rows:calc(100vh - 58px - 240px) 240px;height:calc(100vh - 58px);}
/* 左侧竖向工具栏 */
.left-toolbar{background:#2c2c30;border-right:1px solid #111;padding:8px 4px;grid-row:1/3;}
.tool-button{width:42px;height:42px;margin:5px auto;background:#38383c;border-radius:4px;display:grid;place-items:center;cursor:pointer;font-weight:bold;color:#c8ccd4;}
.tool-button:hover{background:#4a4a50;}
.tool-button.active{background:#094872;border:1px solid #4096ff;color:#fff;}
/* 左下角素材箱 */
.asset-panel{grid-row:2;grid-column:2;background:#242426;border-top:1px solid #111;border-right:1px solid #111;padding:8px;display:flex;flex-direction:column;min-height:0;}
.asset-head{font-size:13px;padding-bottom:6px;border-bottom:1px solid #333;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.asset-list{flex:1;overflow-y:auto;min-height:0;}
.asset-item{padding:5px 8px;font-size:12px;border-radius:3px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.asset-item:hover{background:#333338;}
.asset-item.active{background:#094872;}
.asset-item .del{opacity:0;cursor:pointer;color:#ff8888;padding:0 4px;}
.asset-item:hover .del{opacity:1;}
/* 右上预览视口区域 */
.viewport-wrap{grid-column:3;grid-row:1;display:flex;flex-direction:column;gap:8px;padding:8px;background:transparent;min-height:0;}
.viewport{flex:1;border:1px solid #444;border-radius:4px;display:grid;place-items:center;color:#888;background:transparent;min-height:0;}
.vp-tools{position:absolute;top:12px;right:16px;display:flex;gap:4px;z-index:5;}
.vp-tools button{background:rgba(30,30,36,.85);border:1px solid #555;color:#c8ccd4;width:28px;height:28px;border-radius:3px;cursor:pointer;font-size:13px;}
.vp-tools button:hover{background:#094872;}
/* 底部时间轴 */
.timeline-wrap{grid-column:3;grid-row:2;background:#242426;border-top:1px solid #111;display:flex;flex-direction:column;min-height:0;}
.timeline-tabs{height:28px;background:#2c2c30;display:flex;border-bottom:1px solid #111;align-items:center;}
.tab-item{padding:4px 14px;font-size:12px;border-right:1px solid #222;cursor:pointer;}
.tab-item.active{background:#1e1e1e;border-top:2px solid #4096ff;}
.tab-add{padding:4px 10px;font-size:12px;cursor:pointer;color:#888;}
.tab-add:hover{color:#fff;}
.timeline-body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;}
.tl-ruler{height:18px;background:#1e1e1e;border-bottom:1px solid #333;position:relative;overflow:hidden;}
.tl-ruler span{position:absolute;top:2px;font-size:10px;color:#777;}
.tl-tracks{flex:1;overflow-y:auto;min-height:0;position:relative;}
.track-row{height:38px;background:#2c2c30;border-radius:4px;margin:5px 8px;display:flex;align-items:center;padding-left:10px;font-size:12px;position:relative;border:1px solid transparent;}
.track-row .track-label{width:110px;color:#9aa;flex-shrink:0;}
.clip-block{position:absolute;top:4px;height:30px;background:#2367ac;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#cfe3ff;overflow:hidden;white-space:nowrap;}
.clip-block:hover{background:#2e7cc7;}
.clip-block.cursor-here{outline:1px solid #ffd966;}
.tl-playhead{position:absolute;top:0;bottom:0;width:1px;background:#ffd966;z-index:5;pointer-events:none;}
.tl-playhead::after{content:"";position:absolute;top:0;left:-4px;border:5px solid transparent;border-top:6px solid #ffd966;}
/* 全局右键菜单 */
.context-menu{position:absolute;background:#2c2c30;border:1px solid #555;min-width:180px;z-index:9999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.5);}
.ctx-main-item{padding:5px 12px;font-size:12px;cursor:pointer;}
.ctx-main-item:hover{background:#094872;}
.ctx-divider{height:1px;background:#444;margin:3px 0;}
.ctx-sub{position:absolute;left:100%;top:0;background:#2c2c30;border:1px solid #555;min-width:160px;display:none;}
.has-sub{position:relative;}
.has-sub:hover .ctx-sub{display:block;}
/* 右侧操作栏 */
.top-actions{position:absolute;top:8px;right:12px;display:flex;gap:4px;z-index:20;}
.top-actions button{background:#38383c;border:1px solid #555;color:#d6dae3;padding:3px 12px;border-radius:3px;cursor:pointer;font-size:12px;}
.top-actions button:hover{background:#094872;}
.top-actions button.play{background:#1d6f42;}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1d6f42;color:#fff;padding:6px 16px;border-radius:4px;font-size:12px;z-index:99999;opacity:.95;}
.toast.error{background:#a03030;}
</style>
</head>
<body>

<!-- 顶部标题栏 -->
<div class="title-bar">
  <span id="projName">BBS 编辑器</span>
  <span class="title-dirty" id="dirtyMark">*</span>
  <span id="filmName" style="color:#889"></span>
  <div class="title-btn" id="btnSave">保存 (Ctrl+S)</div>
  <div class="title-btn" id="btnClose">关闭</div>
</div>

<!-- 顶部主菜单栏 -->
<div class="main-menu">
  <div class="menu-top-item">文件<div class="menu-dropdown">
    <div class="menu-item" data-a="save">保存</div>
    <div class="menu-item" data-a="newScene">新建场景</div>
    <div class="menu-item" data-a="newCharacter">新建角色</div>
    <div class="menu-item" data-a="newEntity">新建实体</div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-a="closeEditor">退出编辑器</div>
  </div></div>
  <div class="menu-top-item">编辑<div class="menu-dropdown">
    <div class="menu-item" data-a="undo">撤销</div>
    <div class="menu-item" data-a="redo">重做</div>
  </div></div>
  <div class="menu-top-item">视图<div class="menu-dropdown">
    <div class="menu-item" data-a="cameraMode" data-v="0">跟随相机</div>
    <div class="menu-item" data-a="cameraMode" data-v="1">自由相机</div>
    <div class="menu-item" data-a="cameraMode" data-v="2">轨道相机</div>
    <div class="menu-item" data-a="cameraMode" data-v="4">第三人称</div>
  </div></div>
  <div class="menu-top-item">轨道<div class="menu-dropdown">
    <div class="menu-item" data-a="toggleControl">演员控制</div>
    <div class="menu-item" data-a="clipOp" data-op="delete" data-idx="-1">删除选中剪辑</div>
  </div></div>
  <div class="menu-top-item">关键帧<div class="menu-dropdown">
    <div class="menu-item" data-a="toggleInstantKeys">瞬间关键帧开关</div>
  </div></div>
  <div class="menu-top-item">录制<div class="menu-dropdown">
    <div class="menu-item" data-a="toggleRecord">开始/停止录制</div>
  </div></div>
  <div class="menu-top-item">渲染<div class="menu-dropdown">
    <div class="menu-item" data-a="closeEditor">渲染设置（暂用退出）</div>
  </div></div>
  <div class="menu-top-item">窗口<div class="menu-dropdown">
    <div class="menu-item" data-a="togglePlay">预览播放</div>
  </div></div>
  <div class="menu-top-item">设置<div class="menu-dropdown">
    <div class="menu-item" data-a="toggleInstantKeys">关键帧设置</div>
  </div></div>
</div>

<div class="container">
  <!-- 左侧变换工具竖栏 -->
  <div class="left-toolbar">
    <div class="tool-button" data-tool="Q" title="选择/相机 Q">Q</div>
    <div class="tool-button" data-tool="W" title="平移/自由相机 W">W</div>
    <div class="tool-button" data-tool="E" title="旋转/轨道相机 E">E</div>
    <div class="tool-button" data-tool="R" title="缩放/第三人称 R">R</div>
    <div class="tool-button" data-tool="T" title="演员控制 T">T</div>
    <div class="tool-button" data-tool="C" title="切片/第一人称 C">C</div>
    <div class="tool-button" data-tool="S" title="吸附/瞬间关键帧 S">S</div>
    <div class="tool-button" data-tool="Y" title="动作模板/新建实体 Y">Y</div>
    <div class="tool-button" data-tool="F" title="录制 F">F</div>
  </div>

  <!-- 左下角素材箱 -->
  <div class="asset-panel" id="assetBox">
    <div class="asset-head">素材资源箱 <span style="color:#888;font-size:11px">(右键空白新建)</span></div>
    <div class="asset-list" id="assetList"></div>
  </div>

  <!-- 右上预览视口 -->
  <div class="viewport-wrap" style="position:relative">
    <div class="vp-tools">
      <button id="btnPlay" title="播放/暂停 (空格)">▶</button>
      <button id="btnToStart" title="回到开头">⏮</button>
      <button id="btnUndo" title="撤销">↶</button>
      <button id="btnRedo" title="重做">↷</button>
    </div>
    <div class="viewport" id="mainViewport"></div>
  </div>

  <!-- 底部时间轴 -->
  <div class="timeline-wrap">
    <div class="timeline-tabs">
      <div class="tab-item active" id="tabFilm">相机序列</div>
      <div class="tab-add" id="btnNewSeq" title="新建序列">+ 序列</div>
      <div style="margin-left:auto;padding:0 10px;font-size:11px;color:#888">
        <span id="tickInfo">0 / 0</span>
      </div>
    </div>
    <div class="timeline-body">
      <div class="tl-ruler" id="ruler"></div>
      <div class="tl-tracks" id="tracks"></div>
      <div class="tl-playhead" id="playhead"></div>
    </div>
  </div>
</div>

<!-- 素材箱右键菜单 -->
<div class="context-menu" id="assetCtx">
  <div class="ctx-main-item has-sub">新建项 ▶<div class="ctx-sub">
    <div class="ctx-main-item" data-a="newScene">场景</div>
    <div class="ctx-main-item" data-a="newCharacter">角色</div>
    <div class="ctx-main-item" data-a="newEntity">实体</div>
  </div></div>
  <div class="ctx-main-item has-sub">导入 ▶<div class="ctx-sub">
    <div class="ctx-main-item" data-a="importAsset">导入素材</div>
  </div></div>
  <div class="ctx-divider"></div>
  <div class="ctx-main-item" data-a="save">保存项目</div>
  <div class="ctx-main-item" data-a="closeEditor">关闭编辑器</div>
</div>

<!-- 剪辑块右键菜单 -->
<div class="context-menu" id="clipCtx">
  <div class="ctx-main-item" data-a="clipOp" data-op="split">在播放头拆分</div>
  <div class="ctx-divider"></div>
  <div class="ctx-main-item" data-a="clipOp" data-op="delete">删除剪辑块</div>
  <div class="ctx-main-item" data-a="toggleControl">演员控制</div>
</div>

<script>
var state = null;
var lastCursor = -1;
var selectedClip = -1;

/* ---------- JSQuery 桥（JS -> Java） ---------- */
function sendAction(payload, cb){
  if (window.javaQuery) {
    window.javaQuery({request: JSON.stringify(payload)}, function(ok, result){
      if (!ok && result) notify('操作失败: ' + result, true);
      if (cb) cb(ok, result);
    });
  } else {
    notify('桥未就绪', true);
  }
}

function notify(msg, isError){
  var t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 400); }, 1600);
}

/* ---------- 状态同步（Java 推送 window.bbsState） ---------- */
function sync(){
  if (!window.bbsState) return;
  state = window.bbsState;

  document.getElementById('projName').textContent = state.project || 'BBS 编辑器';
  document.getElementById('filmName').textContent = state.film || '';
  document.getElementById('dirtyMark').classList.toggle('show', !!state.dirty);
  document.getElementById('btnPlay').textContent = state.running ? '⏸' : '▶';
  document.getElementById('tickInfo').textContent = state.cursor + ' / ' + (state.duration || 0);

  renderAssets();
  renderTracks();
  updatePlayhead();
}

/* ---------- 素材箱 ---------- */
function renderAssets(){
  var box = document.getElementById('assetList');
  box.innerHTML = '';
  (state.scenes || []).forEach(function(sc){
    var d = document.createElement('div');
    d.className = 'asset-item' + (sc.id === state.scene ? ' active' : '');
    d.textContent = '🎬 ' + sc.name;
    d.onclick = function(){ sendAction({a:'openScene', id:sc.id}); };
    box.appendChild(d);
  });
  (state.replays || []).forEach(function(rp){
    var d = document.createElement('div');
    d.className = 'asset-item';
    var span = document.createElement('span');
    span.textContent = (rp.enabled ? '👤 ' : '🚫 ') + rp.label;
    var del = document.createElement('span');
    del.className = 'del';
    del.textContent = '✕';
    del.onclick = function(e){ e.stopPropagation(); sendAction({a:'deleteReplay', index:rp.index}); };
    d.appendChild(span); d.appendChild(del);
    d.onclick = function(){ sendAction({a:'toggleReplay', index:rp.index}); };
    box.appendChild(d);
  });
}

/* ---------- 时间轴 ---------- */
function renderTracks(){
  var tracks = document.getElementById('tracks');
  tracks.innerHTML = '';
  var dur = Math.max(1, state.duration || 1);

  var row = document.createElement('div');
  row.className = 'track-row';
  var label = document.createElement('div');
  label.className = 'track-label';
  label.textContent = '相机轨道';
  row.appendChild(label);

  (state.clips || []).forEach(function(cl, i){
    var pxPerTick = (tracks.clientWidth - 130) / dur;
    var w = Math.max(10, Math.round(cl.duration * pxPerTick));
    var x = 130 + Math.round(cl.tick * pxPerTick);
    var b = document.createElement('div');
    b.className = 'clip-block';
    b.style.left = x + 'px';
    b.style.width = w + 'px';
    b.textContent = cl.title || ('剪辑' + i);
    b.onclick = function(){ sendAction({a:'setCursor', tick:cl.tick}); };
    b.oncontextmenu = function(e){
      e.preventDefault();
      selectedClip = i;
      showCtx('clipCtx', e.clientX, e.clientY);
    };
    row.appendChild(b);
  });

  tracks.appendChild(row);

  /* 标尺 */
  var ruler = document.getElementById('ruler');
  ruler.innerHTML = '';
  var pxPerSec = (ruler.clientWidth - 130) / dur;
  for (var t = 0; t <= dur; t += Math.max(1, Math.round(dur / 10))) {
    var s = document.createElement('span');
    s.style.left = (130 + t * pxPerSec) + 'px';
    s.textContent = t;
    ruler.appendChild(s);
  }
}

function updatePlayhead(){
  var ph = document.getElementById('playhead');
  var tracks = document.getElementById('tracks');
  var dur = Math.max(1, state ? (state.duration || 1) : 1);
  var x = 130 + (state ? state.cursor : 0) * ((tracks.clientWidth - 130) / dur);
  ph.style.left = x + 'px';
  ph.style.top = '30px';
  ph.style.height = (tracks.clientHeight - 30) + 'px';
}

/* ---------- 右键菜单 ---------- */
function showCtx(id, x, y){
  document.querySelectorAll('.context-menu').forEach(function(m){ m.style.display = 'none'; });
  var m = document.getElementById(id);
  m.style.display = 'block';
  m.style.left = x + 'px';
  m.style.top = y + 'px';
}

document.addEventListener('click', function(){
  document.querySelectorAll('.context-menu').forEach(function(m){ m.style.display = 'none'; });
});
document.addEventListener('contextmenu', function(e){
  if (!e.target.closest('.asset-panel') && !e.target.closest('.clip-block') && !e.target.closest('.context-menu')) {
    e.preventDefault();
  }
});

/* 素材箱空白右键 */
document.getElementById('assetBox').addEventListener('contextmenu', function(e){
  if (e.target.closest('.asset-item')) return;
  e.preventDefault();
  showCtx('assetCtx', e.clientX, e.clientY);
});

/* 右键菜单项统一处理 */
document.addEventListener('click', function(e){
  var item = e.target.closest('.menu-item, .ctx-main-item');
  if (!item) return;
  var a = item.getAttribute('data-a');
  if (!a) return;
  if (a === 'cameraMode') sendAction({a:'setCameraMode', mode: parseInt(item.getAttribute('data-v'))});
  else if (a === 'clipOp') {
    var op = item.getAttribute('data-op');
    var idx = item.hasAttribute('data-idx') ? parseInt(item.getAttribute('data-idx')) : selectedClip;
    sendAction({a:'clipOp', op:op, index:idx});
  }
  else if (a === 'importAsset') notify('请在文件资源管理器中把素材放入 projects 目录');
  else sendAction({a:a});
});

/* ---------- 工具栏 ---------- */
document.querySelectorAll('.tool-button').forEach(function(btn){
  btn.onclick = function(){
    document.querySelectorAll('.tool-button').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    sendAction({a:'setTool', tool:btn.getAttribute('data-tool')});
  };
});

/* ---------- 顶部操作 ---------- */
document.getElementById('btnSave').onclick = function(){ sendAction({a:'save'}); notify('已保存'); };
document.getElementById('btnClose').onclick = function(){ sendAction({a:'closeEditor'}); };
document.getElementById('btnPlay').onclick = function(){ sendAction({a:'togglePlay'}); };
document.getElementById('btnToStart').onclick = function(){ sendAction({a:'setCursor', tick:0}); };
document.getElementById('btnUndo').onclick = function(){ sendAction({a:'undo'}); };
document.getElementById('btnRedo').onclick = function(){ sendAction({a:'redo'}); };
document.getElementById('btnNewSeq').onclick = function(){ notify('序列功能开发中'); };

/* 时间轴点击跳帧 */
document.getElementById('tracks').addEventListener('click', function(e){
  if (e.target.closest('.clip-block')) return;
  var rect = e.currentTarget.getBoundingClientRect();
  var dur = Math.max(1, state ? (state.duration || 1) : 1);
  var tick = Math.round((e.clientX - rect.left - 130) / ((rect.width - 130) / dur));
  sendAction({a:'setCursor', tick:Math.max(0, tick)});
});

/* 键盘快捷键 */
document.addEventListener('keydown', function(e){
  if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); sendAction({a:'save'}); }
  else if (e.key === ' ') { e.preventDefault(); sendAction({a:'togglePlay'}); }
});

/* ---------- 启动 ---------- */
function waitBridge(){
  if (window.bbsState !== undefined && window.javaQuery) {
    notify('HTML 编辑器已连接');
    sync();
  } else {
    setTimeout(waitBridge, 100);
  }
}

window.__onState = function(){ if (window.bbsState) sync(); };
waitBridge();
</script>
</body>
</html>
