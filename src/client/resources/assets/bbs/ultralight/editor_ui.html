<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>BBS 重构动画编辑器</title>
<style>
:root{ --left-w:260px; --bottom-h:240px; }
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",Consolas,monospace;user-select:none;}
body{background:#14181e;color:#e6e6e6;height:100vh;overflow:hidden;font-size:13px;}
.ico{width:14px;height:14px;flex:0 0 auto;display:inline-block;vertical-align:middle;}
/* 顶部标题栏 */
.title-bar{height:30px;background:#2c2c30;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #111;font-size:13px;gap:8px;}
.title-dirty{color:#ff5555;display:none;}
.title-dirty.show{display:inline;}
.title-btn{margin-left:auto;padding:3px 10px;background:#38383c;border-radius:3px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px;}
.title-btn:hover{background:#094872;}
/* 主菜单 */
.main-menu{height:28px;background:#242426;display:flex;border-bottom:1px solid #111;}
.menu-top-item{padding:4px 16px;font-size:13px;cursor:pointer;position:relative;}
.menu-top-item:hover{background:#094872;}
.menu-dropdown{position:absolute;top:100%;left:0;background:#2c2c30;border:1px solid #555;min-width:180px;display:none;z-index:50;}
.menu-top-item:hover .menu-dropdown{display:block;}
.menu-item{padding:5px 12px;font-size:12px;cursor:pointer;}
.menu-item:hover{background:#094872;}
.menu-divider{height:1px;background:#444;margin:3px 0;}
/* 布局 */
.editor{display:flex;flex-direction:column;height:calc(100vh - 58px);}
.mid{display:flex;flex:1;min-height:0;}
/* 素材箱 */
.asset-panel{flex:0 0 var(--left-w);background:#242426;border-right:1px solid #111;padding:8px;display:flex;flex-direction:column;min-height:0;min-width:0;}
.asset-head{font-size:13px;padding-bottom:6px;border-bottom:1px solid #333;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.asset-list{flex:1;overflow-y:auto;min-height:0;padding-right:2px;}
.asset-item{padding:5px 8px;font-size:12px;border-radius:3px;cursor:pointer;display:flex;justify-content:flex-start;align-items:center;gap:7px;overflow:hidden;}
.asset-item:hover{background:#333338;}
.asset-item.active{background:#094872;}
.asset-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.asset-item .del{opacity:0;cursor:pointer;color:#ff8888;padding:0 2px;}
.asset-item:hover .del{opacity:1;}
.asset-group{padding:7px 8px 2px;font-size:11px;color:#ffd27c;letter-spacing:1px;border-top:1px solid #2a2a2e;margin-top:5px;}
.asset-root{padding:4px 8px;font-size:13px;font-weight:bold;color:#cfe3ff;border-bottom:1px solid #333;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.asset-sub{padding:2px 0 2px 26px;font-size:11px;color:#7d8a99;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.asset-item.bag{color:#ffd27c;}
/* 分隔条 */
.splitter-v{flex:0 0 5px;cursor:col-resize;background:#0d0f12;}
.splitter-v:hover{background:#094872;}
.splitter-h{flex:0 0 5px;cursor:row-resize;background:#0d0f12;}
.splitter-h:hover{background:#094872;}
/* 右侧 */
.right{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
.viewport-wrap{flex:1 1 auto;display:flex;flex-direction:column;gap:8px;padding:8px;min-height:0;position:relative;}
.viewport{flex:1;border:1px solid #444;border-radius:4px;min-height:0;background:transparent;}
.vp-tools{position:absolute;top:12px;right:16px;display:flex;gap:4px;z-index:5;}
.vp-tools button{background:rgba(30,30,36,.85);border:1px solid #555;color:#c8ccd4;width:28px;height:28px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.vp-tools button:hover{background:#094872;}
.vp-tools button.flip .ico{transform:scaleX(-1);}
/* 时间轴 */
.timeline-wrap{flex:0 0 var(--bottom-h);background:#242426;border-top:1px solid #111;display:flex;flex-direction:column;min-height:0;}
.timeline-tabs{height:28px;background:#2c2c30;display:flex;border-bottom:1px solid #111;align-items:center;flex:0 0 auto;}
.tab-item{padding:4px 14px;font-size:12px;border-right:1px solid #222;cursor:pointer;}
.tab-item.active{background:#1e1e1e;border-top:2px solid #4096ff;}
.tab-add{padding:4px 10px;font-size:12px;cursor:pointer;color:#888;}
.tab-add:hover{color:#fff;}
.timeline-body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;}
.tl-ruler{height:18px;background:#1e1e1e;border-bottom:1px solid #333;position:relative;overflow:hidden;flex:0 0 auto;}
.tl-ruler span{position:absolute;top:2px;font-size:10px;color:#777;}
.tl-tracks{flex:1;overflow-y:auto;min-height:0;position:relative;}
.track-row{height:38px;background:#2c2c30;border-radius:4px;margin:5px 8px;display:flex;align-items:center;padding-left:10px;font-size:12px;position:relative;border:1px solid transparent;}
.track-row .track-label{width:110px;color:#9aa;flex-shrink:0;}
.clip-block{position:absolute;top:4px;height:30px;background:#2367ac;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#cfe3ff;overflow:hidden;white-space:nowrap;padding:0 4px;}
.clip-block:hover{background:#2e7cc7;}
.clip-block.cursor-here{outline:1px solid #ffd966;}
.tl-playhead{position:absolute;top:0;bottom:0;width:1px;background:#ffd966;z-index:5;pointer-events:none;}
.tl-playhead::after{content:"";position:absolute;top:0;left:-4px;border:5px solid transparent;border-top:6px solid #ffd966;}
/* 右键菜单 */
.context-menu{position:absolute;background:#2c2c30;border:1px solid #555;min-width:180px;z-index:9999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.5);}
.ctx-main-item{padding:5px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:7px;}
.ctx-main-item:hover{background:#094872;}
.ctx-divider{height:1px;background:#444;margin:3px 0;}
.ctx-sub{position:absolute;left:100%;top:0;background:#2c2c30;border:1px solid #555;min-width:160px;display:none;}
.has-sub{position:relative;}
.has-sub:hover .ctx-sub{display:block;}
.top-actions{position:absolute;top:8px;right:12px;display:flex;gap:4px;z-index:20;}
.top-actions button{background:#38383c;border:1px solid #555;color:#d6dae3;padding:3px 12px;border-radius:3px;cursor:pointer;font-size:12px;}
.top-actions button:hover{background:#094872;}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1d6f42;color:#fff;padding:6px 16px;border-radius:4px;font-size:12px;z-index:99999;opacity:.95;}
.toast.error{background:#a03030;}
</style>
</head>
<body>

<div class="title-bar">
  <img class="ico" src="svg/work.svg">
  <span id="projName">BBS 编辑器</span>
  <span class="title-dirty" id="dirtyMark">*</span>
  <span id="filmName" style="color:#889"></span>
  <div class="title-btn" id="btnSave"><img class="ico" src="svg/save.svg"> 保存</div>
  <div class="title-btn" id="btnClose"><img class="ico" src="svg/close.svg"> 关闭</div>
</div>

<div class="main-menu">
  <div class="menu-top-item">文件<div class="menu-dropdown">
    <div class="menu-item" data-a="save">保存</div>
    <div class="menu-item" data-a="newScene">新建场景</div>
    <div class="menu-item" data-a="newCharacter">新建角色</div>
    <div class="menu-item" data-a="newEntity">新建实体</div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-a="closeEditor">退出编辑器</div>
  </div></div>
  <div class="menu-top-item">编辑<div class="menu-dropdown">
    <div class="menu-item" data-a="undo">撤销</div>
    <div class="menu-item" data-a="redo">重做</div>
  </div></div>
  <div class="menu-top-item">视图<div class="menu-dropdown">
    <div class="menu-item" data-a="setCameraMode" data-mode="0">跟随相机</div>
    <div class="menu-item" data-a="setCameraMode" data-mode="1">自由相机</div>
    <div class="menu-item" data-a="setCameraMode" data-mode="2">轨道相机</div>
    <div class="menu-item" data-a="setCameraMode" data-mode="4">第三人称</div>
  </div></div>
  <div class="menu-top-item">轨道<div class="menu-dropdown">
    <div class="menu-item" data-a="toggleControl">演员控制</div>
    <div class="menu-item" data-a="clipOp" data-op="delete" data-index="-1">删除选中剪辑</div>
  </div></div>
  <div class="menu-top-item">录制<div class="menu-dropdown">
    <div class="menu-item" data-a="toggleRecord">开始/停止录制</div>
  </div></div>
  <div class="menu-top-item">窗口<div class="menu-dropdown">
    <div class="menu-item" data-a="togglePlay">预览播放</div>
  </div></div>
</div>

<div class="editor">
  <div class="mid">
    <div class="asset-panel" id="assetBox">
      <div class="asset-head"><span>素材资源箱 <span style="color:#888;font-size:11px">(右键空白新建)</span></span><span id="btnEquip" style="cursor:pointer;color:#7cb8ff;font-size:11px;padding:0 4px;">装备</span></div>
      <div class="asset-list" id="assetList"></div>
    </div>

    <div class="splitter-v" id="splitV" title="拖动调整素材箱宽度"></div>

    <div class="right">
      <div class="viewport-wrap">
        <div class="vp-tools">
          <button id="btnPlay" title="播放/暂停 (空格)"><img class="ico" src="svg/play.svg"></button>
          <button id="btnToStart" class="flip" title="回到开头"><img class="ico" src="svg/tostart.svg"></button>
          <button id="btnUndo" title="撤销"><img class="ico" src="svg/undo.svg"></button>
          <button id="btnRedo" title="重做"><img class="ico" src="svg/redo.svg"></button>
        </div>
        <div class="viewport" id="mainViewport"></div>
      </div>

      <div class="splitter-h" id="splitH" title="拖动调整时间轴高度"></div>

      <div class="timeline-wrap">
        <div class="timeline-tabs">
          <div class="tab-item active" id="tabFilm">相机序列</div>
          <div class="tab-add" id="btnNewSeq" title="新建序列">+ 序列</div>
          <div style="margin-left:auto;padding:0 10px;font-size:11px;color:#888"><span id="tickInfo">0 / 0</span></div>
        </div>
        <div class="timeline-body">
          <div class="tl-ruler" id="ruler"></div>
          <div class="tl-tracks" id="tracks"></div>
          <div class="tl-playhead" id="playhead"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="context-menu" id="assetCtx">
  <div class="ctx-main-item has-sub">新建项
    <div class="ctx-sub">
      <div class="ctx-main-item" data-a="newScene"><img class="ico" src="svg/scene.svg"> 场景</div>
      <div class="ctx-main-item" data-a="newCharacter"><img class="ico" src="svg/character.svg"> 角色</div>
      <div class="ctx-main-item" data-a="newEntity"><img class="ico" src="svg/entity.svg"> 实体</div>
      <div class="ctx-main-item" data-a="newParticle"><img class="ico" src="svg/particle.svg"> 粒子</div>
      <div class="ctx-main-item" data-a="newItem"><img class="ico" src="svg/item.svg"> 物品</div>
    </div>
  </div>
  <div class="ctx-divider"></div>
  <div class="ctx-main-item" data-a="save"><img class="ico" src="svg/save.svg"> 保存作品</div>
  <div class="ctx-main-item" data-a="closeEditor"><img class="ico" src="svg/close.svg"> 关闭编辑器</div>
</div>

<div class="context-menu" id="clipCtx">
  <div class="ctx-main-item" data-a="clipOp" data-op="split">在播放头拆分</div>
  <div class="ctx-divider"></div>
  <div class="ctx-main-item" data-a="clipOp" data-op="delete">删除剪辑块</div>
  <div class="ctx-main-item" data-a="toggleControl">演员控制</div>
</div>

<div class="context-menu" id="itemCtx">
  <div class="ctx-main-item" data-a="toBackpack"><img class="ico" src="svg/backpack.svg"> 放入背包</div>
  <div class="ctx-main-item" data-a="deleteReplay"><img class="ico" src="svg/trash.svg"> 删除</div>
</div>

<div class="context-menu" id="bagCtx">
  <div class="ctx-main-item" data-a="fromBackpack"><img class="ico" src="svg/scene.svg"> 导入到本作品</div>
  <div class="ctx-divider"></div>
  <div class="ctx-main-item" data-a="deleteBackpackItem"><img class="ico" src="svg/trash.svg"> 从背包删除</div>
</div>

<script>
var ICON = {
  work:'svg/work.svg', scene:'svg/scene.svg', sequence:'svg/sequence.svg',
  character:'svg/character.svg', entity:'svg/entity.svg', particle:'svg/particle.svg',
  item:'svg/item.svg', backpack:'svg/backpack.svg', camera:'svg/camera.svg'
};
var itemTarget = null;   /* {type, id} of the asset item right-clicked */
var bagTarget = null;    /* name of the backpack item right-clicked */
var selectedClip = -1;

function send(a, p){ p = p || {}; p.a = a; console.log('BBS_ACTION:' + JSON.stringify(p)); }
function toast(msg, err){ var t = document.createElement('div'); t.className = 'toast' + (err ? ' error' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 1800); }

/* ----- 拖拽分隔条 ----- */
var rootStyle = document.documentElement.style;
function cssVar(name){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || 0; }
function startDrag(e, axis, varName, min, max){
  e.preventDefault();
  var start = axis === 'x' ? e.clientX : e.clientY;
  var base = cssVar(varName);
  function move(ev){
    var cur = axis === 'x' ? ev.clientX : ev.clientY;
    var v = Math.max(min, Math.min(max, base + (cur - start)));
    rootStyle.setProperty(varName, v + 'px');
  }
  function up(){ document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}
splitV.addEventListener('mousedown', function(e){ startDrag(e, 'x', '--left-w', 160, 620); });
splitH.addEventListener('mousedown', function(e){ startDrag(e, 'y', '--bottom-h', 120, 620); });

/* ----- 渲染 ----- */
function iconImg(type){ var i = document.createElement('img'); i.className = 'ico'; i.src = ICON[type] || ICON.item; return i; }

function addRoot(text){ var d = document.createElement('div'); d.className = 'asset-root'; d.appendChild(iconImg('work')); var s = document.createElement('span'); s.textContent = text; d.appendChild(s); assetList.appendChild(d); }
function addGroup(text){ var d = document.createElement('div'); d.className = 'asset-group'; d.textContent = text; assetList.appendChild(d); }
function addItem(type, id, label, onClick, refs, isActive, isBag){
  var d = document.createElement('div'); d.className = 'asset-item' + (isActive ? ' active' : '') + (isBag ? ' bag' : '');
  d.appendChild(iconImg(type));
  var s = document.createElement('span'); s.className = 'lbl'; s.textContent = label; d.appendChild(s);
  d.onclick = onClick;
  d.oncontextmenu = function(e){ e.preventDefault(); if(isBag){ bagTarget = label; showMenu(bagCtx, e); } else { itemTarget = { type: type, id: id }; showMenu(itemCtx, e); } };
  assetList.appendChild(d);
  if(refs && refs.length){ refs.forEach(function(r){ var sub = document.createElement('div'); sub.className = 'asset-sub'; sub.textContent = '引用 ' + r.type + ' : ' + r.id; assetList.appendChild(sub); }); }
}
function addBagItem(b){
  var d = document.createElement('div'); d.className = 'asset-item bag';
  d.appendChild(iconImg('backpack'));
  var s = document.createElement('span'); s.className = 'lbl'; s.textContent = (b.label || b.name); d.appendChild(s);
  d.oncontextmenu = function(e){ e.preventDefault(); bagTarget = b.name; showMenu(bagCtx, e); };
  assetList.appendChild(d);
}

function renderAssets(s){
  assetList.innerHTML = '';
  addRoot('作品：' + (s.project || ''));
  addGroup('场景');
  (s.scenes || []).forEach(function(sc){ addItem('scene', sc.id, sc.name, function(){ send('openScene', { id: sc.id }); }); });
  addGroup('序列');
  (s.sequences || []).forEach(function(seq){
    addItem('sequence', seq.id, seq.name + (s.activeSequence === seq.id ? '  ◀' : ''), function(){ send('enterSequence', { id: seq.id }); }, seq.refs, s.activeSequence === seq.id);
  });
  addGroup('角色');
  (s.characters || []).forEach(function(c){ addItem('character', String(c.index), c.label, function(){ send('addToCurrent', { type:'character', id:String(c.index) }); }); });
  addGroup('实体');
  (s.entities || []).forEach(function(c){ addItem('entity', String(c.index), c.label, function(){ send('addToCurrent', { type:'entity', id:String(c.index) }); }); });
  addGroup('粒子');
  (s.particles || []).forEach(function(c){ addItem('particle', String(c.index), c.label, function(){ send('addToCurrent', { type:'particle', id:String(c.index) }); }); });
  addGroup('物品');
  (s.items || []).forEach(function(c){ addItem('item', String(c.index), c.label, function(){ send('addToCurrent', { type:'item', id:String(c.index) }); }); });
  addGroup('全局背包');
  (s.backpack || []).forEach(function(b){ addBagItem(b); });
}

function renderTimeline(s){
  var dur = s.duration || 0;
  var cursor = s.cursor || 0;
  tickInfo.textContent = cursor + ' / ' + dur;
  /* ruler */
  ruler.innerHTML = '';
  var w = tracks.clientWidth;
  var pxPerTick = dur > 0 ? (w - 120) / dur : 1;
  for(var t = 0; t <= dur; t += Math.max(1, Math.round(dur / 10))){
    var sp = document.createElement('span'); sp.style.left = (120 + t * pxPerTick) + 'px'; sp.textContent = t; ruler.appendChild(sp);
  }
  /* tracks */
  tracks.innerHTML = '';
  (s.clips || []).forEach(function(cl, i){
    var row = document.createElement('div'); row.className = 'track-row';
    var lab = document.createElement('span'); lab.className = 'track-label'; lab.textContent = cl.title || ('剪辑 ' + i); row.appendChild(lab);
    var blk = document.createElement('div'); blk.className = 'clip-block' + (selectedClip === i ? ' cursor-here' : '');
    blk.style.left = (120 + cl.tick * pxPerTick) + 'px';
    blk.style.width = Math.max(20, cl.duration * pxPerTick) + 'px';
    blk.textContent = cl.title || ('剪辑 ' + i);
    blk.onclick = function(e){ e.stopPropagation(); selectedClip = i; send('clipOp', { op:'select', index:i }); renderTimeline(s); };
    blk.oncontextmenu = function(e){ e.preventDefault(); selectedClip = i; showMenu(clipCtx, e); };
    row.appendChild(blk);
    tracks.appendChild(row);
  });
  /* playhead */
  playhead.style.left = (120 + cursor * pxPerTick) + 'px';
}

function renderAll(){
  var s = window.bbsState;
  if(!s) return;
  projName.textContent = s.project || 'BBS 编辑器';
  filmName.textContent = s.scene ? ('场景：' + s.scene) : '';
  dirtyMark.className = 'title-dirty' + (s.dirty ? ' show' : '');
  renderAssets(s);
  renderTimeline(s);
}
window.__onState = renderAll;

/* ----- 右键菜单 ----- */
function showMenu(menu, e){
  hideMenus();
  menu.style.display = 'block';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
}
function hideMenus(){ [assetCtx, clipCtx, itemCtx, bagCtx].forEach(function(m){ m.style.display = 'none'; }); }
document.addEventListener('click', hideMenus);
[assetCtx, clipCtx, itemCtx, bagCtx].forEach(function(m){
  m.querySelectorAll('.ctx-main-item, .menu-item').forEach(function(it){
    it.onclick = function(e){ e.stopPropagation(); var a = it.getAttribute('data-a'); if(!a) return; var p = {}; ['data-mode','data-op','data-index','data-type'].forEach(function(k){ if(it.getAttribute(k) != null) p[k.replace('data-','')] = it.getAttribute(k); }); if(a === 'fromBackpack' && bagTarget) p.name = bagTarget; if(a === 'deleteBackpackItem' && bagTarget) p.name = bagTarget; if(a === 'toBackpack' && itemTarget){ p.type = itemTarget.type; p.id = itemTarget.id; } if(a === 'deleteReplay' && itemTarget) p.index = parseInt(itemTarget.id); send(a, p); hideMenus(); renderAll(); };
  });
});

/* ----- 顶部/工具按钮 ----- */
btnSave.onclick = function(){ send('save'); };
btnClose.onclick = function(){ send('closeEditor'); };
btnPlay.onclick = function(){ send('togglePlay'); };
btnToStart.onclick = function(){ send('setCursor', { tick:0 }); };
btnUndo.onclick = function(){ send('undo'); };
btnRedo.onclick = function(){ send('redo'); };
btnNewSeq.onclick = function(){ send('newSequence'); };
btnEquip.onclick = function(){ if(selectedClip >= 0) send('openEquip', { index: selectedClip }); };
document.querySelectorAll('.menu-item').forEach(function(it){ it.onclick = function(e){ e.stopPropagation(); var a = it.getAttribute('data-a'); if(!a) return; var p = {}; if(it.getAttribute('data-mode') != null) p.mode = parseInt(it.getAttribute('data-mode')); if(it.getAttribute('data-op') != null) p.op = it.getAttribute('data-op'); if(it.getAttribute('data-index') != null) p.index = parseInt(it.getAttribute('data-index')); send(a, p); hideMenus(); }; });
assetList.addEventListener('contextmenu', function(e){ if(e.target === assetList){ e.preventDefault(); showMenu(assetCtx, e); } });

/* 空格键播放/暂停 */
document.addEventListener('keydown', function(e){ if(e.code === 'Space'){ e.preventDefault(); send('togglePlay'); } });

renderAll();
</script>
</body>
</html>
