<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>BBS-N 动画编辑器</title>
<style>
/* ============================================================
   BBS-N 动画编辑器 - Ultralight 页面
   通过 window.bbs (EditorBridge) 驱动真实 BBS 数据模型
   预览区透明 -> 露出游戏世界画面
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI","Microsoft YaHei",sans-serif;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;color:#d6dae3;font-size:13px;}
:root{
  --bg:#1b1d23; --bg2:#22252c; --bg3:#2a2e37; --bg4:#343947;
  --border:#12141a; --border2:#3a3f4d;
  --text:#d6dae3; --text-dim:#8a90a0; --text-faint:#5a6070;
  --accent:#4a90d9; --accent2:#2e6db4; --accent-soft:#1d3a5c;
  --dirty:#ff6b4a; --ok:#4ac26b; --clip:#3b6fb3;
}

/* ============ 顶部标题栏 ============ */
.title-bar{height:30px;background:var(--bg2);display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--border);gap:8px;flex-shrink:0;}
.title-bar .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);}
.title-bar .title-name{font-weight:600;}
.title-bar .title-dirty{color:var(--dirty);font-weight:700;display:none;}
.title-bar .title-project{color:var(--text);}
.title-bar .title-right{margin-left:auto;color:var(--text-faint);font-size:11px;}

/* ============ 顶部主菜单栏 ============ */
.menu-bar{height:28px;background:var(--bg3);display:flex;align-items:stretch;border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:50;}
.menu-top{display:flex;align-items:center;padding:0 14px;cursor:pointer;position:relative;border-bottom:2px solid transparent;font-size:12px;}
.menu-top:hover,.menu-top.open{background:var(--accent-soft);border-bottom-color:var(--accent);}
.menu-top.disabled{opacity:.4;pointer-events:none;}
.dropdown{position:absolute;top:100%;left:0;min-width:200px;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;padding:4px;z-index:100;}
.dropdown.show{display:block;}
.menu-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:3px;cursor:pointer;white-space:nowrap;font-size:12px;}
.menu-item:hover{background:var(--accent-soft);}
.menu-item.disabled{opacity:.4;pointer-events:none;}
.menu-item .shortcut{margin-left:auto;color:var(--text-faint);font-size:11px;}
.menu-sep{height:1px;background:var(--border2);margin:4px 6px;}
.menu-item.danger:hover{background:#4a2a2a;}

/* ============ 主体布局 ============ */
.workspace{position:absolute;top:58px;left:0;right:0;bottom:0;display:flex;}

/* 左侧素材箱 (25%) */
.left-col{width:25%;height:100%;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.asset-head{display:flex;align-items:center;padding:8px 10px;font-weight:600;border-bottom:1px solid var(--border);gap:6px;background:var(--bg3);font-size:12px;}
.asset-head .count{margin-left:auto;color:var(--text-faint);font-size:11px;font-weight:400;}
.asset-body{flex:1;overflow-y:auto;padding:4px;}
.asset-group{font-size:11px;color:var(--text-faint);padding:8px 8px 3px;letter-spacing:1px;display:flex;align-items:center;}
.asset-group .add{width:16px;height:16px;line-height:16px;text-align:center;border-radius:3px;cursor:pointer;color:var(--text-dim);font-size:12px;}
.asset-group .add:hover{background:var(--accent2);color:#fff;}
.asset-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:3px;cursor:pointer;position:relative;font-size:12px;}
.asset-item:hover{background:var(--bg3);}
.asset-item.selected{background:var(--accent-soft);border:1px solid var(--accent2);}
.asset-item .ico{width:16px;text-align:center;flex-shrink:0;}
.asset-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.asset-item .tag{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.asset-item .actions{display:none;gap:2px;flex-shrink:0;}
.asset-item:hover .actions{display:flex;}
.asset-item .actions span{width:18px;height:18px;line-height:18px;text-align:center;border-radius:3px;color:var(--text-dim);font-size:11px;}
.asset-item .actions span:hover{background:var(--bg4);color:var(--text);}
.asset-item .actions span.on{color:var(--ok);}
.asset-item .actions span.del:hover{background:#5a2a2a;color:var(--dirty);}

/* 右侧主区 (75%) */
.main-col{flex:1;display:flex;flex-direction:column;min-width:0;}
.viewports{flex:1;position:relative;min-height:0;background:transparent;}

/* 预览区工具条（半透明浮层，不遮住画面中央） */
.vp-tools{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(0,0,0,.6);border-radius:4px;padding:3px;z-index:7;}
.vp-tools button{background:transparent;border:none;color:#c8ccd4;width:28px;height:28px;border-radius:3px;cursor:pointer;font-size:13px;}
.vp-tools button:hover{background:rgba(255,255,255,.15);color:#fff;}
.vp-tools button.on{background:var(--accent2);color:#fff;}
.vp-tools button.primary{background:var(--accent);color:#fff;}
.vp-tools button.primary:hover{background:var(--accent2);}

/* ============ 底部时间轴 (240px) ============ */
.timeline{height:240px;background:var(--bg2);border-top:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.tl-bar{height:30px;background:var(--bg3);display:flex;align-items:center;padding:0 8px;gap:6px;border-bottom:1px solid var(--border);}
.tl-bar button{background:var(--bg4);border:1px solid var(--border2);border-radius:3px;color:var(--text);height:22px;padding:0 10px;cursor:pointer;font-size:11px;}
.tl-bar button:hover{background:var(--accent2);border-color:var(--accent2);}
.tl-bar button.play{background:var(--accent);border-color:var(--accent);color:#fff;}
.tl-bar .tl-info{margin-left:auto;color:var(--text-faint);font-size:11px;}
.tl-ruler{height:20px;background:var(--bg);border-bottom:1px solid var(--border);position:relative;overflow:hidden;flex-shrink:0;}
.tl-ruler span{position:absolute;bottom:2px;font-size:9px;color:var(--text-faint);}
.tl-body{flex:1;position:relative;overflow-y:auto;background:var(--bg2);}
.tl-lane{position:relative;height:100%;}
.tl-clip{position:absolute;top:6px;height:22px;background:var(--clip);border-radius:3px;border-left:2px solid #5da3e0;display:flex;align-items:center;padding:0 8px;font-size:11px;overflow:hidden;white-space:nowrap;color:#d6e4f5;}
.tl-clip.disabled{opacity:.4;}
.tl-clip .layer{color:#9db8d8;font-size:10px;margin-right:6px;}
.tl-playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--dirty);z-index:20;pointer-events:none;}
.tl-playhead::after{content:"";position:absolute;top:0;left:-4px;border:5px solid transparent;border-top:6px solid var(--dirty);}

/* ============ 全局消息 ============ */
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2e6db4;color:#fff;padding:7px 18px;border-radius:4px;z-index:9999;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.4);}
.toast.error{background:#b44a3a;}

/* ============ 滚动条 ============ */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#454c5e;}
</style>
</head>
<body>

<!-- ============ 顶部标题栏 ============ -->
<div class="title-bar">
  <div class="dot"></div>
  <span class="title-name">BBS-N</span>
  <span>-</span>
  <span class="title-dirty" id="dirtyStar">*</span>
  <span class="title-project" id="projectName">未打开项目</span>
  <span class="title-right" id="filmInfo">—</span>
</div>

<!-- ============ 顶部主菜单栏 ============ -->
<div class="menu-bar" id="menuBar">
  <div class="menu-top" data-menu="file">文件</div>
  <div class="menu-top" data-menu="edit">编辑</div>
  <div class="menu-top" data-menu="help">帮助</div>
</div>

<div class="workspace">
  <!-- ============ 左侧素材箱 ============ -->
  <div class="left-col" id="assetBox">
    <div class="asset-head">素材资源箱 <span class="count" id="assetCount"></span></div>
    <div class="asset-body">
      <div class="asset-group">场景 <span class="add" id="btnNewScene" title="新建场景">＋</span></div>
      <div id="sceneList"></div>
      <div class="asset-group">角色 <span class="add" id="btnNewCharacter" title="新建角色">＋</span></div>
      <div id="replayList"></div>
    </div>
  </div>

  <!-- ============ 右侧主区 ============ -->
  <div class="main-col">
    <!-- 预览区：透明，露出游戏世界画面 -->
    <div class="viewports">
      <div class="vp-tools">
        <button id="btnPlay" title="播放/暂停 (空格)" onclick="togglePlay()">▶</button>
        <button title="上一帧" onclick="seek(-1)">◀</button>
        <button title="下一帧" onclick="seek(1)">▶|</button>
        <button title="保存 (Ctrl+S)" onclick="doSave()">💾</button>
        <button id="btnUndo" title="撤销 (Ctrl+Z)" onclick="bbs.undo()">↩</button>
        <button id="btnRedo" title="重做 (Ctrl+Y)" onclick="bbs.redo()">↪</button>
        <button title="关闭编辑器" onclick="bbs.closeEditor()">✕</button>
      </div>
    </div>

    <!-- 底部时间轴 -->
    <div class="timeline">
      <div class="tl-bar">
        <button class="play" id="tlPlay" onclick="togglePlay()">▶ 播放</button>
        <button onclick="seek(-10)">◀◀ 10帧</button>
        <button onclick="seek(10)">10帧 ▶▶</button>
        <span class="tl-info" id="timecode">0 / 0</span>
      </div>
      <div class="tl-ruler" id="ruler"></div>
      <div class="tl-body" id="tlBody">
        <div class="tl-lane" id="tlLane"></div>
        <div class="tl-playhead" id="playhead" style="left:0"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   BBS-N HTML 编辑器 - 通过 window.bbs 驱动真实数据
   ============================================================ */

var $ = function(s){ return document.querySelector(s); };
var bridge = null;

/* ---------- 等待 Java 桥接对象就绪 ---------- */
function waitBridge(){
  if (window.bbs) { bridge = window.bbs; notify('HTML 编辑器已连接'); init(); }
  else setTimeout(waitBridge, 50);
}

function notify(msg, isError){
  var t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 1800);
}

/* ---------- 全局状态 ---------- */
var state = null;
var selectedScene = null;
var selectedReplay = -1;
var dragging = false;

function init(){
  sync();
  setInterval(sync, 200);
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('click', function(e){
    var it = e.target.closest('.asset-item');
    if (it && it.dataset.kind === 'scene') { selectScene(it.dataset.id); }
    if (it && it.dataset.kind === 'replay') { selectReplay(it); }
  });
  /* 时间轴点击/拖动跳帧 */
  $('#tlBody').addEventListener('mousedown', function(e){
    var rect = $('#tlLane').getBoundingClientRect();
    if (e.clientX < rect.left) return;
    dragging = true;
    seekToX(e.clientX);
  });
  document.addEventListener('mousemove', function(e){ if (dragging) seekToX(e.clientX); });
  document.addEventListener('mouseup', function(){ dragging = false; });
  /* 键盘快捷键 */
  document.addEventListener('keydown', function(e){
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); doSave(); }
    if (e.ctrlKey && e.key.toLowerCase() === 'z') { bridge.undo(); }
    if (e.ctrlKey && e.key.toLowerCase() === 'y') { bridge.redo(); }
    if (e.key === 'Escape') { bridge.closeEditor(); }
  });
  buildMenus();
}

/* ---------- 数据同步 ---------- */
function sync(){
  if (!bridge) return;
  var st;
  try { st = JSON.parse(bridge.getState()); } catch(e){ return; }
  state = st;

  $('#projectName').textContent = st.project ? st.project : '未打开项目';
  $('#dirtyStar').style.display = st.dirty ? 'inline' : 'none';
  $('#filmInfo').textContent = '场景: ' + st.scene + ' | 帧率 30fps | 时长 ' + st.duration + ' 帧';

  renderScenes(st);
  renderReplays(st);
  renderTimeline(st);
  updatePlayButton(st);

  var tc = $('#timecode');
  tc.textContent = st.cursor + ' / ' + st.duration;
}

function renderScenes(st){
  var list = $('#sceneList');
  var html = '';
  (st.scenes || []).forEach(function(s){
    var sel = (s.name === st.scene) ? ' selected' : '';
    html += '<div class="asset-item' + sel + '" data-kind="scene" data-id="' + s.id + '">' +
      '<span class="tag" style="background:#4a90d9"></span><span class="ico">🏙️</span>' +
      '<span class="name">' + esc(s.name) + '</span></div>';
  });
  if (!html) html = '<div class="asset-item" style="color:var(--text-faint)">（无场景，点击 ＋ 新建）</div>';
  list.innerHTML = html;
  $('#assetCount').textContent = (st.scenes||[]).length + ' 场景 / ' + (st.replays||[]).length + ' 角色';
}

function renderReplays(st){
  var list = $('#replayList');
  var html = '';
  (st.replays || []).forEach(function(r){
    var sel = (r.index === selectedReplay) ? ' selected' : '';
    var icon = r.actor ? '🧍' : (r.fp ? '👁' : '🎭');
    var en = r.enabled ? '' : ' style="opacity:.45"';
    html += '<div class="asset-item' + sel + '" data-kind="replay" data-index="' + r.index + '"' + en + '>' +
      '<span class="tag" style="background:' + (r.actor ? '#c45a5a' : '#5ac47a') + '"></span>' +
      '<span class="ico">' + icon + '</span>' +
      '<span class="name">' + esc(r.label || ('角色 ' + (r.index+1))) + '</span>' +
      '<span class="actions">' +
        '<span class="' + (r.enabled ? 'on' : '') + '" title="显示/隐藏" onclick="event.stopPropagation();toggleReplay(' + r.index + ')">' + (r.enabled ? '👁' : '🚫') + '</span>' +
        '<span class="del" title="删除" onclick="event.stopPropagation();delReplay(' + r.index + ')">🗑</span>' +
      '</span></div>';
  });
  if (!html) html = '<div class="asset-item" style="color:var(--text-faint)">（无角色，点击 ＋ 新建）</div>';
  list.innerHTML = html;
}

function renderTimeline(st){
  var lane = $('#tlLane');
  var body = $('#tlBody');
  var rect = lane.getBoundingClientRect();
  var w = rect.width || 600;
  var duration = st.duration > 0 ? st.duration : 1;
  var px = w / duration;

  /* 剪辑 */
  var html = '';
  (st.clips || []).forEach(function(c){
    if (!c.enabled) return;
    var left = c.tick * px;
    var cw = Math.max(10, c.duration * px - 2);
    html += '<div class="tl-clip" style="left:' + left + 'px;width:' + cw + 'px">' +
      '<span class="layer">L' + c.layer + '</span>' + esc(c.title || '剪辑') + '</div>';
  });
  lane.innerHTML = html;

  /* 播放头 */
  var phx = st.cursor * px;
  $('#playhead').style.left = phx + 'px';

  /* 比例尺 */
  var ruler = $('#ruler');
  var rh = '';
  for (var t = 0; t <= duration; t += Math.max(1, Math.round(duration / 12) * 5)) {
    rh += '<span style="left:' + (t * px) + 'px">' + fmt(t) + '</span>';
  }
  ruler.innerHTML = rh;
}

function updatePlayButton(st){
  var playing = !!st.running;
  $('#btnPlay').textContent = playing ? '⏸' : '▶';
  $('#btnPlay').classList.toggle('primary', !playing);
  $('#tlPlay').textContent = playing ? '⏸ 暂停' : '▶ 播放';
}

function fmt(tick){
  var sec = Math.floor(tick / 30);
  var f = tick % 30;
  var m = Math.floor(sec / 60);
  return m + ':' + (sec % 60 < 10 ? '0' : '') + (sec % 60) + ':' + (f < 10 ? '0' : '') + f;
}

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- 操作 ---------- */
function selectScene(id){
  if (selectedScene === id) return;
  selectedScene = id;
  bridge.openScene(id);
  notify('已切换到场景');
}

function selectReplay(el){
  var idx = parseInt(el.dataset.index, 10);
  selectedReplay = idx;
  renderReplays(state);
}

function toggleReplay(idx){
  bridge.toggleReplay(idx);
  notify('角色显示状态已切换');
}

function delReplay(idx){
  if (confirm('确定删除该角色吗？此操作可撤销。')) {
    bridge.deleteReplay(idx);
    notify('角色已删除');
  }
}

function togglePlay(){
  bridge.togglePlay();
  sync();
}

function seek(delta){
  bridge.setCursor((state ? state.cursor : 0) + delta);
}

function seekToX(clientX){
  if (!state) return;
  var rect = $('#tlLane').getBoundingClientRect();
  var w = rect.width || 1;
  var x = Math.max(0, Math.min(w, clientX - rect.left));
  var tick = Math.round(x / w * state.duration);
  bridge.setCursor(tick);
}

function doSave(){
  bridge.save();
  notify('已保存');
}

/* ---------- 顶部菜单 ---------- */
function buildMenus(){
  var menus = {
    file: [
      { label:'新建场景', run:function(){ bridge.newScene(); } },
      { label:'新建角色', run:function(){ bridge.newCharacter(); } },
      { sep:true },
      { label:'保存', shortcut:'Ctrl+S', run:function(){ doSave(); } },
      { sep:true },
      { label:'关闭编辑器', shortcut:'Esc', run:function(){ bridge.closeEditor(); } }
    ],
    edit: [
      { label:'撤销', shortcut:'Ctrl+Z', run:function(){ bridge.undo(); } },
      { label:'重做', shortcut:'Ctrl+Y', run:function(){ bridge.redo(); } },
      { sep:true },
      { label:'播放/暂停', shortcut:'空格', run:function(){ togglePlay(); } }
    ],
    help: [
      { label:'HTML 编辑器由 Ultralight 驱动', disabled:true },
      { label:'数据直接来自 BBS 项目文件', disabled:true }
    ]
  };

  Object.keys(menus).forEach(function(key){
    var d = document.createElement('div');
    d.className = 'dropdown'; d.id = 'dd_' + key;
    buildMenu(d, menus[key]);
    document.body.appendChild(d);
  });

  document.querySelectorAll('.menu-top').forEach(function(el){
    el.onclick = function(e){
      e.stopPropagation();
      var k = el.dataset.menu;
      var open = el.classList.contains('open');
      closeMenus();
      if (!open) {
        el.classList.add('open');
        var d = $('#dd_' + k);
        d.classList.add('show');
        var r = el.getBoundingClientRect();
        d.style.left = r.left + 'px';
        d.style.top = r.bottom + 'px';
      }
    };
  });
  document.addEventListener('click', closeMenus);
}

function buildMenu(container, items){
  container.innerHTML = '';
  items.forEach(function(it){
    if (it.sep) { var s=document.createElement('div'); s.className='menu-sep'; container.appendChild(s); return; }
    var el = document.createElement('div');
    el.className = 'menu-item' + (it.disabled ? ' disabled' : '') + (it.danger ? ' danger' : '');
    el.textContent = it.label;
    if (it.shortcut) { var sc=document.createElement('span'); sc.className='shortcut'; sc.textContent=it.shortcut; el.appendChild(sc); }
    if (it.run) el.onclick = function(){ closeMenus(); it.run(); };
    container.appendChild(el);
  });
}

function closeMenus(){
  document.querySelectorAll('.menu-top').forEach(function(x){ x.classList.remove('open'); });
  document.querySelectorAll('.dropdown').forEach(function(x){ x.classList.remove('show'); });
}

/* 新建场景/角色按钮 */
$('#btnNewScene').onclick = function(){ bridge.newScene(); };
$('#btnNewCharacter').onclick = function(){ bridge.newCharacter(); };

waitBridge();
</script>
</body>
</html>
