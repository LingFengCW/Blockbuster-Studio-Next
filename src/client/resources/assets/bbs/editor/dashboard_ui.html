<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>BBS 作品库</title>
<style>
:root{ --tab:projects; }
/* Palette deliberately identical to editor_ui.html: the picker and the editor
   are two pages of one application, so they must not look like two programs.
   Keep every --c-* / --track-* value in sync with the editor. */
:root{
  --c-bg:#fff; --c-bg-app:#eef1f5; --c-bg-sub:#f5f7fa; --c-bg-hover:#eaf2fb; --c-bg-active:#d4e4fb;
  --c-text:#2b2f36; --c-text-2:#6b7280; --c-text-3:#9aa3af;
  --c-border:#d8dde4; --c-border-2:#c7ccd4;
  --c-accent:#4c8dff; --c-accent-d:#3f7ae6; --c-sel:#ffce4d; --c-ico:var(--c-text); --c-sel-stroke:#2f6fb0;
  --c-scroll-track:#e3e6ea; --c-scroll-thumb:#c7ccd4;
  --track-mat:#4c72c4; --track-act:#37947c; --track-pot:#9153b7; --track-char:#4c8dff; --track-equip:#b9772e;
  --c-clip:#4c72c4; --c-clip-d:#5a86d6; --c-danger:#d9534f; --c-danger-bg:#fdecec;
  --c-success:#1d6f42; --c-amber:#c08a1e; --c-amber-bg:#fff4d6;
  --c-overlay:rgba(30,40,60,.35); --c-shadow:0 10px 30px rgba(20,30,50,.16);
  --c-grid:rgba(60,90,140,.20); --c-grid-2:rgba(60,90,140,.10);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",Consolas,monospace;user-select:none;}
body{background:var(--c-bg-app);color:var(--c-text);height:100vh;overflow:hidden;font-size:13px;display:flex;flex-direction:column;}
.ico{width:14px;height:14px;flex:0 0 auto;display:inline-block;vertical-align:middle;}
/* 顶部标题栏 */
.title-bar{height:30px;background:var(--c-bg-sub);display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--c-border);font-size:13px;gap:8px;}
.title-btn{margin-left:auto;padding:3px 10px;background:var(--c-bg);border-radius:3px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px;}
.title-btn:hover{background:var(--c-accent);}
/* 主菜单 */
.main-menu{height:28px;background:var(--c-bg-sub);display:flex;border-bottom:1px solid var(--c-border);}
.menu-top-item{padding:4px 16px;font-size:13px;cursor:pointer;position:relative;}
.menu-top-item:hover{background:var(--c-accent);}
.menu-dropdown{position:absolute;top:100%;left:0;background:var(--c-bg-sub);border:1px solid var(--c-border-2);min-width:160px;display:none;z-index:50;}
.menu-top-item:hover .menu-dropdown{display:block;}
.menu-item{padding:5px 12px;font-size:12px;cursor:pointer;}
.menu-item:hover{background:var(--c-accent);}
/* 顶部细工具栏（与编辑器同款） */
.toolbar-slim{height:30px;background:var(--c-bg-sub);display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--c-border);}
.toolbar-slim button{display:flex;align-items:center;gap:5px;background:var(--c-bg-sub);color:var(--c-text);border:1px solid var(--c-border-2);border-radius:3px;padding:4px 14px;font-size:12px;cursor:pointer;}
.toolbar-slim button:hover{background:var(--c-accent);color:#fff;}
.toolbar-slim button.active{background:var(--c-accent);color:#fff;border-color:var(--c-accent);}
.toolbar-slim .sep{width:1px;height:18px;background:var(--c-border-2);margin:0 4px;}
.toolbar-slim .hint{color:var(--c-text-3);font-size:11px;margin-left:auto;}
/* 内容区 */
.content{flex:1;overflow-y:auto;padding:16px;}
.view{display:none;}
.view.active{display:block;}
.section-title{font-size:13px;color:var(--c-accent);margin:4px 0 12px;border-bottom:1px solid var(--c-border);padding-bottom:6px;}
/* 作品库 */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.proj-card{background:linear-gradient(160deg,var(--c-bg-sub),var(--c-bg));border:1px solid var(--c-border-2);border-radius:6px;height:96px;position:relative;cursor:pointer;overflow:hidden;display:flex;align-items:flex-end;padding:10px;}
.proj-card:hover{border-color:var(--c-accent);}
.proj-card .nm{font-size:14px;font-weight:bold;color:#fff;text-shadow:0 1px 3px #000;}
.proj-card .meta{position:absolute;top:8px;left:10px;font-size:11px;color:var(--c-text-2);}
.proj-card .acts{position:absolute;top:6px;right:8px;display:none;gap:6px;}
.proj-card:hover .acts{display:flex;}
.proj-card .acts span{cursor:pointer;color:var(--c-text-2);font-size:13px;padding:0 2px;}
.proj-card .acts span:hover{color:var(--c-accent);}
.proj-card .acts .del:hover{color:var(--c-danger);}
.proj-new{background:var(--c-bg);border:1px dashed var(--c-success);border-radius:6px;height:96px;display:flex;align-items:center;justify-content:center;color:var(--c-success);cursor:pointer;font-size:13px;gap:6px;}
.proj-new:hover{background:var(--c-bg-sub);}
/* 支持者（banner 为横幅图，非头像——与 legacy UISupporterBanner 一致） */
.sup-group-title{font-size:13px;color:var(--c-amber);letter-spacing:1px;margin:16px 0 10px;}
.sup-grid{display:flex;flex-wrap:wrap;gap:12px;}
.sup-card{width:250px;background:var(--c-bg-sub);border:1px solid var(--c-border-2);border-radius:8px;overflow:hidden;cursor:default;}
.sup-card.link{cursor:pointer;}
.sup-card.link:hover{border-color:var(--c-accent);}
.sup-banner{height:88px;background:linear-gradient(135deg,var(--c-bg-sub),var(--c-bg));position:relative;}
.sup-banner img{width:100%;height:100%;object-fit:cover;display:block;}
.sup-banner.noban{background:linear-gradient(135deg,var(--c-bg-sub),var(--c-bg));}
.sup-name{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:14px;color:var(--c-text);}
.sup-name a{color:var(--c-accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sup-tag{margin-left:auto;font-size:11px;padding:2px 9px;border-radius:9px;background:var(--c-border-2);color:var(--c-text-2);flex:0 0 auto;}
/* 设置 */
.set-row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--c-border);gap:12px;}
.set-row .lbl{font-size:13px;}
.set-row .desc{font-size:11px;color:var(--c-text-3);margin-top:2px;}
.set-row .grow{flex:1;}
.toggle{width:44px;height:24px;border-radius:12px;background:var(--c-bg-sub);position:relative;cursor:pointer;transition:background .15s;flex:0 0 auto;}
.toggle.on{background:var(--c-success);}
.toggle .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;}
.toggle.on .knob{left:22px;}
/* 设置：模块切换 + 设置项行（与编辑器同款控件观感） */
.set-mods{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px;}
.set-mods button{background:var(--c-bg-sub);color:var(--c-text);border:1px solid var(--c-border-2);border-radius:3px;padding:4px 14px;font-size:12px;cursor:pointer;font-family:inherit;}
.set-mods button:hover{background:var(--c-bg-hover);}
.set-mods button.active{background:var(--c-accent);color:#fff;border-color:var(--c-accent);}
.set-group{margin:0 0 18px;}
.set-group-title{font-size:12px;color:var(--c-accent);letter-spacing:.5px;border-bottom:1px solid var(--c-border);padding-bottom:6px;margin:14px 0 4px;}
.set-row2{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--c-border);}
.set-row2 .lbl2{flex:1;font-size:12px;color:var(--c-text);cursor:default;}
.set-row2 .ctl{flex:0 0 auto;display:flex;align-items:center;gap:6px;}
.set-row2 input[type=number],.set-row2 input[type=text],.set-row2 select{background:var(--c-bg);border:1px solid var(--c-border-2);color:var(--c-text);border-radius:3px;padding:3px 6px;font-size:12px;font-family:inherit;width:120px;}
.set-row2 select{cursor:pointer;}
.set-row2 input[type=color]{width:36px;height:22px;padding:0;border:1px solid var(--c-border-2);background:var(--c-bg);cursor:pointer;}
.set-row2 .num{width:64px;}
.set-row2.ro .val2{font-size:11px;color:var(--c-text-3);}
.ver{font-size:12px;color:var(--c-text-2);padding:10px 0;}
.btn{background:var(--c-bg-sub);color:var(--c-text);border:1px solid var(--c-border-2);border-radius:3px;padding:6px 14px;font-size:12px;cursor:pointer;}
.btn:hover{background:var(--c-accent);color:#fff;}
/* 新建弹窗 */
.modal-mask{position:fixed;inset:0;background:var(--c-overlay);display:none;align-items:center;justify-content:center;z-index:9000;}
.modal-mask.show{display:flex;}
.modal{background:var(--c-bg-sub);border:1px solid var(--c-border-2);border-radius:6px;padding:18px;width:360px;}
.modal h3{font-size:14px;margin-bottom:14px;}
.modal input,.modal select{width:100%;background:var(--c-bg-app);border:1px solid var(--c-border);color:var(--c-text);border-radius:3px;padding:7px;font-size:13px;margin-bottom:12px;font-family:inherit;}
.modal .row{display:flex;gap:8px;justify-content:flex-end;}
/* 更新提示（左下角，任何 BBS 界面） */
.update-toast{position:fixed;left:16px;bottom:16px;width:300px;background:var(--c-bg);border:1px solid var(--c-accent-d);border-radius:6px;padding:12px 14px;z-index:9999;display:none;box-shadow:var(--c-shadow);}
.update-toast.show{display:block;}
.update-toast .t{font-size:13px;color:var(--c-accent);font-weight:bold;}
.update-toast .s{font-size:11px;color:var(--c-text-2);margin:4px 0 10px;}
.update-toast .row{display:flex;gap:8px;}
.update-toast .row .x{margin-left:auto;cursor:pointer;color:var(--c-text-2);}
.update-toast .row .x:hover{color:var(--c-text);}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--c-success);color:#fff;padding:6px 16px;border-radius:4px;font-size:12px;z-index:99999;opacity:.95;}
.toast.error{background:var(--c-danger);}
</style>
</head>
<body>

<div class="title-bar">
  <img class="ico" src="svg/work.svg">
  <span>BBS 作品库</span>
  <div class="title-btn" id="btnTitle"><img class="ico" src="svg/close.svg"> 返回标题</div>
</div>

<div class="main-menu">
  <div class="menu-top-item">文件<div class="menu-dropdown">
    <div class="menu-item" data-a="backToTitle">返回标题界面</div>
  </div></div>
  <div class="menu-top-item">视图<div class="menu-dropdown">
    <div class="menu-item" data-a="setTab" data-tab="projects">作品库</div>
    <div class="menu-item" data-a="setTab" data-tab="supporters">支持者</div>
    <div class="menu-item" data-a="setTab" data-tab="settings">设置</div>
  </div></div>
</div>

<div class="toolbar-slim">
  <button data-tab="projects"><img class="ico" src="svg/work.svg"> 作品库</button>
  <button data-tab="supporters"><img class="ico" src="svg/character.svg"> 支持者</button>
  <button data-tab="settings"><img class="ico" src="svg/settings.svg"> 设置</button>
  <span class="sep"></span>
  <span class="hint">BBS · Blockbuster Studio Next</span>
</div>

<div class="content">
  <!-- 作品库 -->
  <div class="view active" id="view-projects">
    <div class="section-title">我的作品</div>
    <div class="proj-grid" id="projGrid"></div>
  </div>

  <!-- 支持者 -->
  <div class="view" id="view-supporters">
    <div class="section-title">感谢以下支持者 ❤</div>
    <div id="supWrap"></div>
  </div>

  <!-- 设置 -->
  <div class="view" id="view-settings">
    <div class="section-title">设置</div>

    <!-- 模块切换（BBS 及任何注册了设置模块的 mod） -->
    <div class="set-mods" id="setMods"></div>

    <!-- 完整设置树：由 Java 侧按 模块 → 分类 → 值 导出渲染 -->
    <div id="setModules"></div>

    <div class="section-title" style="margin-top:26px;">更新器</div>
    <div class="set-row">
      <div class="grow">
        <div class="lbl">自动更新</div>
        <div class="desc">发现新版本时自动下载并暂存，确认后于 MC 关闭时替换</div>
      </div>
      <div class="toggle" id="tgAuto" data-key="autoUpdate"><div class="knob"></div></div>
    </div>
    <div class="set-row">
      <div class="grow">
        <div class="lbl">更新推送</div>
        <div class="desc">有新版时在本界面左下角弹出提示</div>
      </div>
      <div class="toggle" id="tgPush" data-key="updatePush"><div class="knob"></div></div>
    </div>
    <div class="set-row">
      <div class="grow">
        <div class="lbl">实时 UI（实验）</div>
        <div class="desc">从仓库拉取沙箱脚本，仅可改动界面，让你不更新也能体验新版界面（默认关闭）</div>
      </div>
      <div class="toggle" id="tgLive" data-key="liveUi"><div class="knob"></div></div>
    </div>
    <div class="ver" id="verLine"></div>
    <button class="btn" id="btnCheck">立即检查更新</button>
  </div>
</div>

<!-- 新建作品弹窗 -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <h3>新建作品</h3>
    <input id="npName" placeholder="作品名称">
    <div class="row">
      <button class="btn" id="npCancel">取消</button>
      <button class="btn" id="npOk" style="background:var(--c-success);">创建</button>
    </div>
  </div>
</div>

<!-- 更新提示 -->
<div class="update-toast" id="upToast">
  <div class="t" id="upTitle">新版本可用</div>
  <div class="s" id="upSub"></div>
  <div class="row">
    <button class="btn" id="upBtn">更新</button>
    <span class="x" id="upX">忽略</span>
  </div>
</div>

<script>
var curTab = 'projects';
function send(a, p){ p = p || {}; p.a = a; console.log('BBS_ACTION:' + JSON.stringify(p)); }
function toast(msg, err){ var t = document.createElement('div'); t.className = 'toast' + (err ? ' error' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 1800); }

/* 切换 tab */
function setTab(tab){
  /* 切回设置页时重建设置树，让语言等改动后的新文案被重新拉取。 */
  if(tab === 'settings' && curTab !== 'settings'){ setBuilt = ''; }
  curTab = tab;
  document.documentElement.style.setProperty('--tab', tab);
  document.querySelectorAll('.toolbar-slim button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
  document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('active', v.id === 'view-' + tab); });
}

/* 渲染作品库（key 缓存：状态每 150ms 推送一次，避免全量重建 DOM） */
var projKey = '';
function renderProjects(s){
  var grid = document.getElementById('projGrid');
  var key = JSON.stringify(s.projects || []);
  if(key === projKey) return;
  projKey = key;
  grid.innerHTML = '';
  var neu = document.createElement('div');
  neu.className = 'proj-new';
  neu.innerHTML = '<img class="ico" src="svg/plus.svg"> 新建作品';
  neu.onclick = openNewModal;
  grid.appendChild(neu);
  (s.projects || []).forEach(function(p){
    var c = document.createElement('div');
    c.className = 'proj-card';
    c.innerHTML = '<div class="meta">' + (p.createdAt || '') + '</div>' +
      '<div class="nm">' + escapeHtml(p.name) + '</div>' +
      '<div class="acts"><span class="rn" title="重命名">✎</span><span class="del" title="删除">✕</span></div>';
    c.onclick = function(){ send('openProject', { id: p.id }); };
    c.querySelector('.del').onclick = function(e){ e.stopPropagation(); if(confirm('删除作品「' + p.name + '」？')) send('deleteProject', { id: p.id }); };
    c.querySelector('.rn').onclick = function(e){ e.stopPropagation(); var n = prompt('重命名为：', p.name); if(n && n.trim()) send('renameProject', { id: p.id, name: n.trim() }); };
    grid.appendChild(c);
  });
}

/* 渲染支持者：banner 是横幅图（非头像），失败显示渐变占位；
   平台徽标取自链接域名，点击卡片经 send('openLink') 用系统浏览器打开。
   用 key 缓存避免每次状态推送(150ms)重建 DOM 导致图片反复加载抽搐。 */
var supKey = '';
function renderSupporters(groups){
  var wrap = document.getElementById('supWrap');
  var key = JSON.stringify(groups || {});
  if(key === supKey) return;
  supKey = key;
  wrap.innerHTML = '';
  var defs = [['developers','开发者'], ['cc','内容创作者'], ['super','超级支持者'], ['early','BBS 抢先体验']];
  defs.forEach(function(d){
    var list = (groups && groups[d[0]]) || [];
    if(!list.length) return;
    var t = document.createElement('div'); t.className = 'sup-group-title'; t.textContent = d[1];
    wrap.appendChild(t);
    var grid = document.createElement('div'); grid.className = 'sup-grid';
    list.forEach(function(sup){
      var card = document.createElement('div');
      card.className = 'sup-card' + (sup.link ? ' link' : '');
      if(sup.banner){
        var b = document.createElement('div'); b.className = 'sup-banner';
        var img = document.createElement('img'); img.src = sup.banner; img.alt = '';
        img.onerror = function(){ b.classList.add('noban'); img.remove(); };
        b.appendChild(img); card.appendChild(b);
      }
      var nameRow = document.createElement('div'); nameRow.className = 'sup-name';
      if(sup.link){
        var a = document.createElement('a'); a.href = sup.link; a.title = sup.link; a.textContent = sup.name;
        nameRow.appendChild(a);
        var tag = document.createElement('span'); tag.className = 'sup-tag'; tag.textContent = plat(sup.link);
        nameRow.appendChild(tag);
        card.onclick = function(){ send('openLink', { url: sup.link }); };
      } else { nameRow.appendChild(document.createTextNode(sup.name)); }
      card.appendChild(nameRow);
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  });
}
function plat(link){
  if(link.indexOf('bilibili') >= 0) return 'B站';
  if(link.indexOf('youtube') >= 0) return 'YT';
  if(link.indexOf('twitter') >= 0 || link.indexOf('//x.com') >= 0) return 'X';
  if(link.indexOf('douyin') >= 0 || link.indexOf('tiktok') >= 0) return '抖音';
  if(link.indexOf('kuaishou') >= 0) return '快手';
  return '链接';
}

/* 渲染设置（更新器部分） */
function renderSettings(s){
  var st = s.settings || { autoUpdate:false, updatePush:true };
  document.getElementById('tgAuto').classList.toggle('on', !!st.autoUpdate);
  document.getElementById('tgPush').classList.toggle('on', !!st.updatePush);
  document.getElementById('tgLive').classList.toggle('on', !!st.liveUi);
  document.getElementById('verLine').textContent = '当前版本：' + (s.localVersion || '?');
}

/* 渲染 BBS 完整设置树（模块 → 分类 → 值）。DOM 结构只在切换模块时重建：
   状态每 150ms 推送一次，若每次重建会打断正在输入的数字/文本框。 */
var setModsKey = '';
var curSetMod = '';
var setBuilt = '';

function renderSettingsModules(s){
  var mods = s.settingsModules || [];
  var bar = document.getElementById('setMods');
  var host = document.getElementById('setModules');

  if(!mods.length){
    bar.innerHTML = '';
    host.innerHTML = '';
    setModsKey = '';
    setBuilt = '';
    curSetMod = '';
    return;
  }

  if(!curSetMod) curSetMod = mods[0].id;

  var mk = mods.map(function(m){ return m.id + ':' + (m.title || ''); }).join('|');
  if(mk !== setModsKey){
    setModsKey = mk;
    bar.innerHTML = '';
    mods.forEach(function(m){
      var b = document.createElement('button');
      b.textContent = m.title || m.id;
      b.setAttribute('data-mod', m.id);
      b.onclick = function(){ curSetMod = m.id; setBuilt = ''; renderSettingsModules(window.bbsState); };
      bar.appendChild(b);
    });
  }
  bar.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-mod') === curSetMod); });

  if(setBuilt === curSetMod) return;
  setBuilt = curSetMod;
  host.innerHTML = '';

  var mod = null;
  mods.forEach(function(m){ if(m.id === curSetMod) mod = m; });
  if(!mod) return;

  var langs = s.languages || [];
  var total = 0;

  (mod.categories || []).forEach(function(cat){
    var vals = cat.values || [];
    if(!vals.length) return;
    var g = document.createElement('div'); g.className = 'set-group';
    var t = document.createElement('div'); t.className = 'set-group-title'; t.textContent = cat.title || cat.id;
    if(cat.tooltip) t.title = cat.tooltip;
    g.appendChild(t);
    vals.forEach(function(v){ g.appendChild(setRow(mod.id, v, langs)); total++; });
    host.appendChild(g);
  });

  if(!total){
    var empty = document.createElement('div'); empty.className = 'ver';
    empty.textContent = '该模块暂无可显示的设置项。';
    host.appendChild(empty);
  }
}

/* 单个设置项控件。改动后只发回 Java、不回读状态，避免打断正在进行的输入。 */
function setRow(modId, v, langs){
  var row = document.createElement('div');
  row.className = 'set-row2';
  var lbl = document.createElement('div');
  lbl.className = 'lbl2';
  lbl.textContent = v.title || v.id;
  if(v.tooltip) lbl.title = v.tooltip;
  row.appendChild(lbl);

  var ctl = document.createElement('div');
  ctl.className = 'ctl';
  row.appendChild(ctl);

  function push(val, alpha){
    var p = { module: modId, id: v.id, value: val };
    if(alpha !== undefined) p.alpha = alpha;
    send('setBbsValue', p);
  }

  if(v.type === 'bool'){
    var tg = document.createElement('div');
    tg.className = 'toggle' + (v.value ? ' on' : '');
    tg.innerHTML = '<div class="knob"></div>';
    tg.onclick = function(){ var on = !this.classList.contains('on'); this.classList.toggle('on', on); push(on); };
    ctl.appendChild(tg);
  }
  else if(v.type === 'int' || v.type === 'number'){
    var inp = document.createElement('input');
    inp.type = 'number';
    inp.value = v.value;
    if(typeof v.min === 'number' && isFinite(v.min)) inp.min = v.min;
    if(typeof v.max === 'number' && isFinite(v.max)) inp.max = v.max;
    inp.step = (v.type === 'int') ? 1 : 0.01;
    inp.onchange = function(){
      var n = (v.type === 'int') ? parseInt(this.value, 10) : parseFloat(this.value);
      if(isNaN(n)) return;
      push(v.type === 'int' ? Math.round(n) : n);
    };
    ctl.appendChild(inp);
  }
  else if(v.type === 'color'){
    var col = document.createElement('input');
    col.type = 'color';
    col.value = v.value;
    ctl.appendChild(col);
    var alphaInp = null;
    if(v.hasAlpha){
      alphaInp = document.createElement('input');
      alphaInp.type = 'number'; alphaInp.className = 'num';
      alphaInp.min = 0; alphaInp.max = 255;
      alphaInp.value = (typeof v.alpha === 'number') ? v.alpha : 255;
      alphaInp.title = '不透明度（0-255）';
      ctl.appendChild(alphaInp);
    }
    var pushColor = function(){
      var a = 255;
      if(alphaInp){ a = parseInt(alphaInp.value, 10); if(isNaN(a)) a = 255; }
      push(col.value, a);
    };
    col.onchange = pushColor;
    if(alphaInp) alphaInp.onchange = pushColor;
  }
  else if(v.type === 'modes'){
    var sel = document.createElement('select');
    (v.labels || []).forEach(function(l, i){
      var op = document.createElement('option');
      op.value = i; op.textContent = l;
      if(i === v.value) op.selected = true;
      sel.appendChild(op);
    });
    sel.onchange = function(){ push(parseInt(this.value, 10)); };
    ctl.appendChild(sel);
  }
  else if(v.type === 'language'){
    var lsel = document.createElement('select');
    var found = false;
    langs.forEach(function(l){
      var op = document.createElement('option');
      op.value = l.value; op.textContent = l.title || l.value;
      if(l.value === v.value){ op.selected = true; found = true; }
      lsel.appendChild(op);
    });
    if(!found && v.value){
      var cur = document.createElement('option');
      cur.value = v.value; cur.textContent = v.value; cur.selected = true;
      lsel.appendChild(cur);
    }
    lsel.onchange = function(){ push(this.value); toast('语言已保存，界面文本将在重载后更新'); };
    ctl.appendChild(lsel);
  }
  else if(v.type === 'string'){
    var si = document.createElement('input');
    si.type = 'text';
    si.value = v.value == null ? '' : v.value;
    si.onchange = function(){ push(this.value); };
    ctl.appendChild(si);
  }
  else {
    row.classList.add('ro');
    var ro = document.createElement('span');
    ro.className = 'val2';
    ro.textContent = '需在高级设置中编辑';
    ctl.appendChild(ro);
  }

  return row;
}

/* 更新提示 */
function renderUpdate(s){
  var t = document.getElementById('upToast');
  if(!s.update){ t.classList.remove('show'); return; }
  document.getElementById('upTitle').textContent = '发现新版本 ' + s.update.version;
  document.getElementById('upSub').textContent = (s.update.releaseName || '') + (s.update.staged ? '（已下载，待安装）' : '（点击下载并安装）');
  document.getElementById('upBtn').textContent = s.update.staged ? '安装更新' : '下载并更新';
  t.classList.add('show');
}

function renderAll(){
  var s = window.bbsState;
  if(!s) return;
  if(s.localVersion === undefined) s.localVersion = '?';
  renderProjects(s);
  renderSupporters(s.supporters);
  renderSettings(s);
  renderUpdate(s);
  setTab(curTab);
}
window.__onState = renderAll;

/* 新建作品弹窗 */
function openNewModal(){
  document.getElementById('npName').value = '';
  document.getElementById('modal').classList.add('show');
  document.getElementById('npName').focus();
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('npCancel').onclick = closeModal;
document.getElementById('npOk').onclick = function(){
  var name = document.getElementById('npName').value.trim();
  if(!name){ toast('请输入作品名称', true); return; }
  send('createProject', { name: name });
  closeModal();
};

/* 顶部/菜单/按钮 */
document.querySelectorAll('.toolbar-slim button').forEach(function(b){ b.onclick = function(){ setTab(b.getAttribute('data-tab')); }; });
document.querySelectorAll('.main-menu .menu-item').forEach(function(it){
  it.onclick = function(e){ e.stopPropagation(); var a = it.getAttribute('data-a'); if(a === 'setTab'){ setTab(it.getAttribute('data-tab')); } else { send(a, {}); } };
});
document.getElementById('btnTitle').onclick = function(){ send('backToTitle'); };
document.getElementById('btnCheck').onclick = function(){ send('checkUpdate'); toast('正在检查更新…'); };
document.getElementById('tgAuto').onclick = function(){ var k = this.getAttribute('data-key'); var on = !this.classList.contains('on'); this.classList.toggle('on', on); send('setSetting', { key:k, value:on }); };
document.getElementById('tgPush').onclick = function(){ var k = this.getAttribute('data-key'); var on = !this.classList.contains('on'); this.classList.toggle('on', on); send('setSetting', { key:k, value:on }); };
document.getElementById('tgLive').onclick = function(){ var k = this.getAttribute('data-key'); var on = !this.classList.contains('on'); this.classList.toggle('on', on); send('setSetting', { key:k, value:on }); if(on){ toast('已开启实时 UI，将从仓库拉取界面脚本'); } };
document.getElementById('upBtn').onclick = function(){ send('updateNow'); toast('已开始更新（MC 关闭后自动替换）'); };
document.getElementById('upX').onclick = function(){ send('dismissUpdate'); document.getElementById('upToast').classList.remove('show'); };

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

renderAll();
</script>
