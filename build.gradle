plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version + "-" + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = "IrisShaders"
		url = "https://maven.irisshaders.dev/"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	productionNamespace = 'named'

	mods {
		"bbs" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "maven.modrinth:sodium:${project.sodium_version}"
	compileOnly "maven.modrinth:iris:${project.iris_version}"

	implementation "org.anarres:jcpp:${project.jcpp_version}"
	implementation "io.github.douira:glsl-transformer:${project.glsl_transformer_version}"

	// Embedded JavaScript engine for user script plugins (pure Java, bundled via JiJ).
	include implementation("org.mozilla:rhino:${project.rhino_version}")

	// Ultralight HTML UI engine - LabyMod Java bindings (maven central).
	// Native binaries (Ultralight SDK bin/) are loaded at runtime from the
	// game dir or classpath; see lingfeng.bbsnext.ultralight.UltralightUI.
	implementation "com.labymedia:ultralight-java-base:${project.ultralight_version}"
	include implementation("com.labymedia:ultralight-java-base:${project.ultralight_version}")

	// Ultralight databind - Java <-> JavaScript interop (bind a Java object
	// into the page so the HTML editor can drive the real BBS data model).
	implementation "com.labymedia:ultralight-java-databind:${project.ultralight_version}"
	include implementation("com.labymedia:ultralight-java-databind:${project.ultralight_version}")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}

/* ------------------------------------------------------------------ */
/* Automatic build-count increment                                    */
/* Version rule: major.minor.build-count (see gradle.properties).     */
/* Every successful build that actually compiled code bumps the       */
/* trailing build-count by one. Listing tasks / syncing does NOT bump.*/
/* ------------------------------------------------------------------ */

def incrementBuildNumber()
{
    def propsFile = project.file('gradle.properties')

    if (!propsFile.exists())
    {
        return
    }

    def version = null

    propsFile.eachLine('UTF-8') { line ->
        if (line =~ /^\s*mod_version\s*=\s*(.+)/)
        {
            version = (line =~ /^\s*mod_version\s*=\s*(.+)/)[0][1]
        }
    }

    if (version == null)
    {
        return
    }

    def parts = version.tokenize('.')

    if (parts.size() < 3)
    {
        return
    }

    parts[2] = ((parts[2] as int) + 1).toString()

    def newVersion = parts.join('.')

    def lines = propsFile.readLines('UTF-8')
    def output = lines.collect { line ->
        if (line =~ /^\s*mod_version\s*=/)
        {
            return "mod_version=" + newVersion
        }

        return line
    }

    propsFile.write(output.join('\n'), 'UTF-8')

    println "Build count: ${version} -> ${newVersion}"
}

def compiledThisBuild = false

gradle.taskGraph.afterTask { task ->
    if (task.name == 'compileJava' || task.name == 'compileClientJava')
    {
        compiledThisBuild = true
    }
}

gradle.buildFinished { result ->
    if (result.failure == null && compiledThisBuild)
    {
        incrementBuildNumber()
    }
}
