plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version + "-" + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = "IrisShaders"
		url = "https://maven.irisshaders.dev/"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	productionNamespace = 'official'

	mods {
		"bbs" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "maven.modrinth:sodium:${project.sodium_version}"
	compileOnly "maven.modrinth:iris:${project.iris_version}"

	implementation "org.anarres:jcpp:${project.jcpp_version}"
	implementation "io.github.douira:glsl-transformer:${project.glsl_transformer_version}"

	// Embedded JavaScript engine for user script plugins (pure Java, bundled via JiJ).
	include implementation("org.mozilla:rhino:${project.rhino_version}")

	// jcef-api is bundled inside the mcef-modern jar (nested META-INF/jars);
	// expose it at compile time from a local copy in libs/.
	implementation files("libs/jcef-api-jcef-d3de827+cef-146.0.10+g8219561+chromium-146.0.7680.179.jar")

	// MCEF Modern - Minecraft Chromium Embedded Framework. Provides the
	// browser engine (JCEF/Chromium) with a working GPU driver and native
	// MC 26.2 texture integration. Ships as a separate mod in the mods
	// folder (it manages its own nested jcef jars and downloads the
	// Chromium binaries at startup).
	implementation "maven.modrinth:mcef-modern:${project.mcef_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}

/* ------------------------------------------------------------------ */
/* Automatic build-count increment                                    */
/* Version rule: major.minor.build-count (see gradle.properties).     */
/* Every successful build that actually compiled code bumps the       */
/* trailing build-count by one. Listing tasks / syncing does NOT bump.*/
/* ------------------------------------------------------------------ */

def incrementBuildNumber()
{
    def propsFile = project.file('gradle.properties')

    if (!propsFile.exists())
    {
        return
    }

    def version = null

    propsFile.eachLine('UTF-8') { line ->
        if (line =~ /^\s*mod_version\s*=\s*(.+)/)
        {
            version = (line =~ /^\s*mod_version\s*=\s*(.+)/)[0][1]
        }
    }

    if (version == null)
    {
        return
    }

    def parts = version.tokenize('.')

    if (parts.size() < 3)
    {
        return
    }

    parts[2] = ((parts[2] as int) + 1).toString()

    def newVersion = parts.join('.')

    def lines = propsFile.readLines('UTF-8')
    def output = lines.collect { line ->
        if (line =~ /^\s*mod_version\s*=/)
        {
            return "mod_version=" + newVersion
        }

        return line
    }

    propsFile.write(output.join('\n'), 'UTF-8')

    println "Build count: ${version} -> ${newVersion}"
}

def compiledThisBuild = false

gradle.taskGraph.afterTask { task ->
    if (task.name == 'compileJava' || task.name == 'compileClientJava')
    {
        compiledThisBuild = true
    }
}

gradle.buildFinished { result ->
    if (result.failure == null && compiledThisBuild)
    {
        incrementBuildNumber()
    }
}
